name: Build and Test EBA Fashion Studio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Frontend with Vite
      run: npm run build

    - name: Verify Build Artifacts
      run: |
        test -f dist/index.html || exit 1
        test -f dist/admin.html || exit 1
        echo "✅ Vite production bundle verified successfully!"

    # Optional: If you wish to deploy automatically via Hostinger FTP/FTPS
    # Uncomment the following step and add HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME,
    # and HOSTINGER_FTP_PASSWORD to your GitHub Repository Secrets:
    #
    # - name: Deploy to Hostinger via FTP
    #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
    #   with:
    #     server: ${{ secrets.HOSTINGER_FTP_SERVER }}
    #     username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
    #     password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
    #     local-dir: ./
    #     dangerous-clean-slate: false
